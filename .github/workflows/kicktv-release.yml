name: Build and Release KickTV

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Signed KickTV APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Verify Translations
        run: python3 scripts/verify_translations_strict.py

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5

      - name: Create google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "Used real google-services.json from secrets"
          else
            cp app/google-services.json.example app/google-services.json
            echo "Used mock google-services.json from example file"
          fi

      - name: Build Signed Release APK
        shell: bash
        run: |
          set +e
          gradle assembleRelease --stacktrace 2>&1 | tee gradle-build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          if [ "$BUILD_EXIT" -ne 0 ]; then
            grep -E '(^e: |FAILURE:|What went wrong|^> |Exception:|Error:)' gradle-build.log | head -n 30 | while IFS= read -r line; do
              echo "::error title=GradleBuild::${line}"
            done
            exit "$BUILD_EXIT"
          fi

      - name: Extract Version & Prepare Release Assets
        id: version
        run: |
          VERSION_BASE=$(grep 'val baseVersion =' app/build.gradle.kts | head -n 1 | awk -F '"' '{print $2}')
          SHORT_SHA=$(git rev-parse --short HEAD)
          VERSION="${VERSION_BASE}-${SHORT_SHA}"

          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

          APK_SRC=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          echo "Located built APK: $APK_SRC"
          test -f "$APK_SRC"

          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          LATEST_BT=$(ls "$SDK_DIR/build-tools" | sort -V | tail -n 1)
          "$SDK_DIR/build-tools/$LATEST_BT/apksigner" verify --print-certs "$APK_SRC"

          cp -f "$APK_SRC" "app/build/outputs/apk/release/KickTV.apk"
          cp -f "$APK_SRC" "app/build/outputs/apk/release/KickTV-${VERSION}.apk"

          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            CHANGES=$(git log --pretty=format:"- %s" "$PREV_TAG"..HEAD)
          else
            CHANGES=$(git log --pretty=format:"- %s" -10)
          fi

          {
            echo 'changes<<EOF'
            echo "$CHANGES"
            echo EOF
          } >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ env.VERSION }}
          name: KickTV v${{ env.VERSION }}
          draft: false
          prerelease: false
          make_latest: true
          files: |
            app/build/outputs/apk/release/KickTV.apk
            app/build/outputs/apk/release/KickTV-${{ env.VERSION }}.apk
          body: |
            ## KickTV for Google TV & Android TV (`v${{ env.VERSION }}`)
            - **Direct Google TV Downloader URL:** `pratikpa.tel/tv` (or `https://github.com/ppratik96/kcik-tv-app/releases/latest/download/KickTV.apk`)
            - **Package ID:** `tel.pratikpa.kicktv`

            ### Recent Changes
            ${{ steps.version.outputs.changes }}
          generate_release_notes: false

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KickTV-v${{ env.VERSION }}
          path: app/build/outputs/apk/release/KickTV.apk
